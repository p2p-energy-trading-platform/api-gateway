services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379

    ports:
      - "${API_GATEWAY_PORT:-8000}:3000"

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - gridx-infra-network

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped